<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'smart_study_tracker_final_v1', THEME_KEY = 'smart_study_tracker_theme', BACKUP_KEY = KEY + '_backup';
const ALL = 'সব বিষয়', MAX_DAYS = 30, NORMAL_YELLOW = 10, NORMAL_RED = 20; // স্বাভাবিক: ০–৯ দিন সবুজ, ১০–১৯ হলুদ, ২০+ লাল; নিজের দেওয়া তারিখ সর্বোচ্চ ৩০ দিন
const ISO = /^\d{4}-\d{2}-\d{2}$/;
const BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const toBn = n => String(n).replace(/\d/g, d => BN[d]);

/* ---------- Safe DOM helper ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
function addDays(base, n) { const [y, m, d] = base.split('-').map(Number); return isoOf(new Date(y, m - 1, d + n)); }
function diffDays(a, b) { // b - a
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function fmt(iso) {
  if (!iso) return '';
  const m = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
  const [y, mn, d] = iso.split('-').map(Number);
  return `${toBn(d)} ${m[mn - 1]}, ${toBn(y)}`;
}
function headerDate() {
  const days = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  const n = new Date();
  return `${days[n.getDay()]}, ${toBn(n.getDate())} ${months[n.getMonth()]} ${toBn(n.getFullYear())}`;
}

/* ---------- Demo data (covers every dashboard section) ---------- */
function demoTopics() {
  const t = today(), o = n => addDays(t, n);
  const mk = (id, subject, topic, pages, notes, created, hist, next) => ({
    id, subject, topic, pages, notes, createdDate: created,
    lastRevisedDate: hist.length ? hist[hist.length - 1] : created,
    nextDueDate: next, history: hist.map((date, i) => ({ date, revNumber: i + 1 }))
  });
  return [
    mk('demo-1', 'বাংলা', 'চর্যাপদ ও বাংলা সাহিত্যের প্রাচীন যুগ', 'পৃষ্ঠা ০৫-১৪', '• আবিষ্কৃত হয় ১৯০৭ সালে হরপ্রসাদ শাস্ত্রী কর্তৃক নেপাল থেকে।\n• সর্বোচ্চ পদ রচয়িতা কাহ্নপা (১৩টি পদ)।', o(-30), [o(-22)], o(-2)),

/* ---------- Theme ---------- */
function applyThemeUI() {
  const dark = document.documentElement.classList.contains('dark');
  $('menu-theme-icon').textContent = dark ? '☀️' : '🌙';
  $('menu-theme-label').textContent = dark ? 'লাইট মোড' : 'ডার্ক মোড';
  $('menu-theme-badge').textContent = dark ? 'Dark' : 'Light';
}
function initTheme() {
  let s = null; try { s = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (s === 'dark' || (!s && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  applyThemeUI();
}
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  applyThemeUI();
}

/* ---------- Export / Import ---------- */
function download(blob, name) {
  const u = URL.createObjectURL(blob), a = el('a', { href: u, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
const SAFE_KEY = KEY + '_safety';
function readSafety() { try { const a = JSON.parse(localStorage.getItem(SAFE_KEY)); if (Array.isArray(a)) return a.filter(x => x && Array.isArray(x.topics) && x.at); } catch (e) {} return []; }
function saveSafety(label) { // সর্বশেষ ৫টি আলাদা কপি রাখে; ফাঁকা ডেটা কখনো কপি হয় না
  if (!topics.length) return;
  const cur = JSON.stringify(topics), list = readSafety();
  if (list[0] && JSON.stringify(list[0].topics) === cur) return;
  list.unshift({ at: new Date().toISOString(), label, topics: JSON.parse(cur) });
  try { localStorage.setItem(SAFE_KEY, JSON.stringify(list.slice(0, 5))); } catch (e) {}
}
function openSafety() {
  const list = readSafety();
  if (!list.length) { toast('এখনো কোনো নিরাপদ কপি নেই।', { error: true }); return; }
  $('safety-list').replaceChildren(...list.map(item => {
    const d = new Date(item.at), time = `${toBn(pad(d.getHours()))}:${toBn(pad(d.getMinutes()))}`;
    return el('button', { class: 'w-full text-left px-3.5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm cursor-pointer', onclick: () => {
      closeModal('safety-modal');
      askConfirm('এই কপি ফিরিয়ে আনবেন?', `${fmt(isoOf(d))}, ${time} — ${toBn(item.topics.length)}টি টপিক। বর্তমান ডেটার একটা কপি আগে রাখা হবে।`, () => {
        saveSafety('ফেরানোর আগে'); snapshot(); topics = normalizeList(item.topics).out; selectedSubject = ALL; zoneFilter = 'all'; commit('নিরাপদ কপি ফিরিয়ে আনা হয়েছে!');
      });
    } }, el('div', { class: 'font-bold text-slate-800 dark:text-slate-100', text: `${fmt(isoOf(d))}, ${time}` }), el('div', { class: 'text-xs text-slate-500 dark:text-slate-400', text: `${toBn(item.topics.length)}টি টপিক · ${item.label || ''}` }));
  }));
  openModal('safety-modal');
}
const LB_KEY = KEY + '_last_backup', FR_KEY = KEY + '_first_run', BACKUP_DAYS = 7;
let bannerHidden = false;
function markBackup() { try { localStorage.setItem(LB_KEY, today()); } catch (e) {} updateBanner(); }
async function shareBackup() {
  const blob = new Blob([JSON.stringify(topics, null, 2)], { type: 'application/json' });
  const name = 'Smart_Study_Backup.json'; // একই নাম — Drive-এ পুরোনো ভার্সন জমা থাকে
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Smart Study Backup' });
      markBackup(); toast('ব্যাকআপ পাঠানো হয়েছে! Drive বেছে থাকলে সেভ হয়ে গেছে।'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { download(blob, name); markBackup(); toast('শেয়ার সাপোর্ট নেই — ফাইল ডাউনলোড হয়েছে, নিজে Drive-এ রাখুন।'); }
  catch (e) { toast('⚠️ ব্যাকআপ তৈরি করা যায়নি।', { error: true }); }
}
function updateBanner() {
  const b = $('backup-banner'); if (!b) return;
  let last = null, first = null;
  try { last = localStorage.getItem(LB_KEY); first = localStorage.getItem(FR_KEY); if (!first) { first = today(); localStorage.setItem(FR_KEY, first); } } catch (e) {}
  const base = last || first || today();
  const stale = topics.length > 0 && !bannerHidden && diffDays(base, today()) >= BACKUP_DAYS;
  b.classList.toggle('hidden', !stale);
  if (!stale) return;
  b.className = 'p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-300 dark:border-amber-800 flex flex-wrap items-center justify-between gap-2';
  b.replaceChildren(el('span', { class: 'text-xs sm:text-sm text-amber-900 dark:text-amber-300', text: `☁️ ${toBn(diffDays(base, today()))} দিন ধরে ব্যাকআপ নেওয়া হয়নি।` }),
    el('div', { class: 'flex gap-2' },
      el('button', { class: 'px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold cursor-pointer', onclick: exportJSON }, 'এখনই ব্যাকআপ'),
      el('button', { class: 'px-3 py-1.5 rounded-xl text-xs text-slate-600 dark:text-slate-300 cursor-pointer', onclick: () => { bannerHidden = true; updateBanner(); } }, 'পরে')));
}
function exportJSON() {
  try { markBackup(); download(new Blob([JSON.stringify(topics, null, 2)], { type: 'application/json' }), `Smart_Study_Backup_${today()}.json`); toast('ব্যাকআপ ডাউনলোড হয়েছে!'); }
  catch (e) { toast('⚠️ ব্যাকআপ তৈরি করা যায়নি।', { error: true }); }
}
function importJSON(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onerror = () => toast('⚠️ ফাইল পড়া যায়নি।', { error: true });
  r.onload = ev => {
    let parsed;
    try { parsed = JSON.parse(ev.target.result); } catch (err) { toast('⚠️ ভুল JSON ফাইল — বর্তমান ডেটা অক্ষত আছে।', { error: true }); return; }
    if (!Array.isArray(parsed)) { toast('⚠️ ফাইলের কাঠামো ঠিক নয় (তালিকা প্রয়োজন) — বর্তমান ডেটা অক্ষত।', { error: true }); return; }
    const { out, skipped } = normalizeList(parsed);
    if (!out.length) { toast('⚠️ ফাইলে কোনো বৈধ টপিক নেই — বর্তমান ডেটা অক্ষত।', { error: true }); return; }
    askConfirm('ব্যাকআপ রিস্টোর করবেন?', `${toBn(out.length)}টি টপিক পাওয়া গেছে${skipped ? ` (${toBn(skipped)}টি অবৈধ বাদ)` : ''}। বর্তমান ডেটা প্রতিস্থাপিত হবে, তবে আগে নিরাপদ কপি রাখা হবে ও Undo করা যাবে।`, () => {
      saveSafety('ইমপোর্টের আগে');
      snapshot(); topics = out; selectedSubject = ALL; zoneFilter = 'all'; commit('রিস্টোর সফল হয়েছে!');
    });
  };
  r.readAsText(f);
}
function csvCell(v) {
  let s = String(v ?? '').replace(/\r?\n/g, ' ');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // formula injection রোধ
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV() {
  if (!topics.length) { toast('এক্সপোর্ট করার মতো ডেটা নেই।', { error: true }); return; }
  const rows = [['বিষয়', 'টপিক', 'পৃষ্ঠা', 'প্রথম পড়া', 'শেষ রিভিশন', 'পরের রিভিশন', 'মোট রিভিশন', 'নোট'],
    ...topics.map(t => [t.subject, t.topic, t.pages, t.createdDate, t.lastRevisedDate, effDue(t), t.history.length, t.notes])];
  try { download(new Blob(['\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8;' }), `Smart_Study_${today()}.csv`); toast('CSV ডাউনলোড হয়েছে!'); }
  catch (e) { toast('⚠️ CSV তৈরি করা যায়নি।', { error: true }); }
}
